<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<!-- frame-src 'self' is what lets the hidden iframe below load index.html.
     Without it the frame is refused by default-src and the suite reports that
     the app exposed no hooks — which reads as an app bug and is a CSP one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Cellar — Tests</title>
<style>
  /* Dev-only page. Colours are Midnight from the theme pack, HARD-CODED on
     purpose: this page must keep working when theme.css is the thing that
     broke, so it is the one file here that does not link it. */
  body { background: #0a0e1a; color: #e7eaf6; margin: 0;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #838cab; font-size: 12.5px; margin: 0 0 18px; }
  #summary { font-weight: 600; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
             border: 1px solid #262f4a; background: #121829; }
  #summary.ok  { color: #72fe84; border-color: #72fe84; }
  #summary.bad { color: #fb7874; border-color: #fb7874; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; border-bottom: 1px solid #262f4a; vertical-align: top; }
  td.st { width: 28px; font-weight: 700; }
  tr.pass td.st { color: #72fe84; }
  tr.fail td.st { color: #fb7874; }
  tr.fail td.msg { color: #fb7874; }
  .msg { color: #838cab; font-size: 12px; white-space: pre-wrap; }
  .group td { padding-top: 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: #838cab; border-bottom-color: #374163; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wine Cellar — Tests</h1>
  <p class="sub">Loads the real index.html in a hidden iframe and calls its functions directly
    — no copies, no build step, so a test cannot drift from the code it tests. Read-only:
    nothing here writes to storage.</p>
  <div id="summary">Loading…</div>
  <table><tbody id="out"></tbody></table>
</div>

<script>
'use strict';

/* ── The completeness floor ────────────────────────────────────────────────
   Every tests.html in this family pins the number of tests it expects to RUN.
   Removing a test fails the build; adding one never does. Without it, tests that
   go MISSING look exactly like tests that pass — a suite that quietly shrank to
   three checks still says "all 3 tests pass". RAISE THIS when you add tests, and
   lower it only when you retire one deliberately. */
const EXPECTED = 309;

/* ── It refuses to run anywhere but localhost, and that is load-bearing ──────
   GitHub Pages publishes this page BESIDE the app, where the iframe below would
   be the reader's real, saved copy — and booting the app IS the side effect, so
   the check cannot live in the load handler. `file://` is deliberately NOT in
   this list: it has no hostname, and treating '' as local sends the page down
   the iframe branch, where the frame silently fails to load and the suite blames
   the app for what is a setup problem. */
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]'];

/* Bust the frame AND the source fetches. They are different caches and they can
   disagree: in the lottery repo this same harness once reported ALL GREEN
   against a page three features out of date, because the source-level tests read
   the file off the server while the frame ran a copy the browser had cached.
   Nothing errored; the new code was simply never run. A suite that can pass
   against a build which exists nowhere is worse than no suite — it turns
   "untested" into "verified". */
const BUST = '?t=' + Date.now();
const bustFetch = (path) => fetch(path + BUST, { cache: 'no-store' });

const TESTS = [];
function group(name) { TESTS.push({ group: name }); }
function t(name, fn) { TESTS.push({ name: name, fn: fn }); }
/* `detail` is the value that FAILED, not more prose: `ok(w <= pin, 'it fits',
   w + 'px')` says what was expected and then shows what was actually there.
   Every suite in the family takes three arguments now (2026-08-26). It was two
   here, and a call site passing a third had its diagnostic silently dropped —
   the assertion still failed correctly, it just refused to say what it saw.
   CodeQL's js/superfluous-trailing-arguments caught it three separate times in
   one day, in three different repos, which is what settled the signature. */
function ok(cond, note, detail) {
  if (cond) return;
  throw new Error((note || 'expected truthy')
    + (detail === undefined ? '' : ' \u2014 got ' + detail));
}
function eq(actual, expected, note) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((note ? note + ' — ' : '') + 'got ' + a + ', wanted ' + b);
}
/* A loop, not a single .replace(): one pass over a multi-character delimiter can
   leave a NEW opener behind that the pass has already gone past. CodeQL flags the
   single-pass version and it was open on five of the nine public repos at once.
   Nothing here renders what it strips — the reason to fix it is that a helper
   which can be fooled about what is commented out is one that can miss a live
   off-origin script, which is what these suites exist to catch. */
/* The text a READER sees, tags removed. Deliberately a scanner and not
   `replace(/<[^>]+>/g, '')`: a single-pass tag strip is the shape CodeQL flags as
   incomplete multi-character sanitization, and it is right to — one pass over
   `<<p>p>` leaves a live tag behind. Nothing here is rendered, so the bug that
   shape would cause here is only a wrong CHARACTER COUNT, but the alert it raises
   is a real High sitting open on the security tab, where a true finding would be
   missed among it. Callers normalise whitespace themselves, as they did before. */
function visibleText(html) {
  let out = '', inTag = false;
  for (const ch of html) {
    if (ch === '<') { inTag = true; continue; }
    if (ch === '>') { inTag = false; continue; }
    if (!inTag) out += ch;
  }
  return out;
}

function stripComments(src) {
  let out = src, prev;
  do { prev = out; out = out.replace(/\/\*[\s\S]*?\*\//g, '').replace(/<!--[\s\S]*?-->/g, ''); }
  while (out !== prev);
  return out;
}

let W = null, H = null;
let APP_SRC = '', PRIVACY_SRC = '', THEME_SRC = '', SW_SRC = '', KILL_SRC = '', MANIFEST_SRC = '';

async function main() {
  if (LOCAL_HOSTS.indexOf(location.hostname) === -1) {
    const s = document.getElementById('summary');
    s.className = 'bad';
    s.textContent = 'This suite only runs on http://localhost — it boots the real app in a '
      + 'frame, which must never happen on the published site. Serve this folder and open '
      + 'http://localhost:<port>/tests.html';
    return;
  }

  APP_SRC      = await (await bustFetch('index.html')).text();
  PRIVACY_SRC  = await (await bustFetch('privacy.html')).text();
  THEME_SRC    = await (await bustFetch('theme.css')).text();
  SW_SRC       = await (await bustFetch('sw.js')).text();
  KILL_SRC     = await (await bustFetch('sw-kill.js')).text();
  MANIFEST_SRC = await (await bustFetch('manifest.webmanifest')).text();

  /* ── Guard the source actually loaded, BEFORE any negative assertion ───────
     An all-NOT test over a fetched file proves nothing when the fetch failed:
     every "must not contain" passes on an empty string, and the suite goes green
     having read nothing. */
  ok(APP_SRC.length > 2000, 'index.html did not load — every check below would pass on an empty string');
  ok(PRIVACY_SRC.length > 500, 'privacy.html did not load');
  ok(THEME_SRC.length > 2000, 'theme.css did not load — is it beside these files?');
  ok(SW_SRC.length > 500, 'sw.js did not load');
  ok(KILL_SRC.length > 100, 'sw-kill.js did not load — the escape hatch has to exist BEFORE it is needed');
  ok(MANIFEST_SRC.length > 100, 'manifest.webmanifest did not load');

  W = await bootApp();
  H = W.__wineTestHooks;
  define();
  await runAsync();
  await run();
}

function bootApp() {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test';
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-wine-tests', '');
    frame.style.cssText = 'position:absolute;width:1000px;height:800px;left:-9999px;top:0';
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      /* Wrapped: reading a property of a frame the CSP refused throws a
         SecurityError, and an uncaught one here never reaches the catch below —
         the suite then sits on "Loading…" saying nothing at all. */
      let hooks = null;
      try { hooks = win && win.__wineTestHooks; } catch (e) { hooks = null; }
      if (hooks) { resolve(win); return; }
      let booted = false, blocked = false;
      try { booted = !!(win.document && win.document.getElementById('listWrap')); }
      catch (e) { blocked = true; }
      reject(new Error(blocked
        ? 'the frame could not be read at all — this page’s CSP needs frame-src \'self\'.'
        : booted
          ? 'index.html loaded but exposed no __wineTestHooks — did something throw while '
            + 'it was starting up? Check the browser console.'
          : 'The hidden frame never loaded index.html — is it being served?'));
    }, { once: true });
    frame.src = 'index.html' + BUST;   /* set before append: one load event, the real one */
    document.body.appendChild(frame);
  });
}

/* ── A SECOND frame, booted as somebody else's snapshot ──────────────────────
   The only honest way to test a shared view: `viewOnly` is decided from the
   URL before anything renders and there is no hook that flips it, deliberately
   — a flag a test can set is a flag a bug can set. So this boots the real app
   at a real '#share=' link, exactly as a reader opening one does.

   `load` fires before boot() has finished, because boot() awaits decodeShare(),
   so the poll waits for the shared-snapshot banner: renderViewbar() unhides it
   inside render(), which is the last thing boot() does. */
function bootShared(token) {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe');
    frame.title = 'app under test, as a shared snapshot';
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('data-wine-tests', '');
    frame.style.cssText = 'position:absolute;width:1000px;height:800px;left:-9999px;top:0';
    frame.src = 'index.html' + BUST + '#share=' + token;
    document.body.appendChild(frame);
    const started = Date.now();
    const poll = () => {
      let win = null, ready = false;
      try {
        win = frame.contentWindow;
        const bar = win.document.getElementById('viewbar');
        ready = !!(win.wcViewOnly && bar && !bar.hidden);
      } catch (e) { /* not readable yet */ }
      if (ready) { resolve(win); return; }
      if (Date.now() - started > 15000) {
        reject(new Error('the shared frame never finished booting — did decodeShare() throw?'));
        return;
      }
      setTimeout(poll, 40);
    };
    poll();
  });
}

/* The two async checks are run up front and their VERDICTS recorded, so a test
   body stays a plain function that either throws or doesn't. */
const asyncResults = {};
async function runAsync() {
  /* ── The render smoke test ────────────────────────────────────────────────
     Everything else in this suite calls a pure function or reads the source as
     text. That covers the arithmetic and the boundaries very well and leaves
     the LARGEST part of the file — the render layer — never executed at all: a
     coverage run over this suite on 2026-08-27 showed the tab panels, the
     dialogs and the export windows all at zero. A throw inside any of them
     would have shipped green, because nothing here had ever drawn a view.

     So this walks the app the way a person does: plant the sample data, visit
     every tab, open and close every dialog, and record anything the frame
     throws while it happens. It is not a substitute for the assertions below —
     it cannot tell a right figure from a wrong one — but it is the difference
     between "the maths is right" and "the app runs".

     THE VERDICT IS RECORDED HERE AND ASSERTED BELOW, like the share round-trip
     under it, because a test body in this runner must be synchronous. `__plant`
     replaces the state in memory and never calls save(), so this still leaves
     the reader's own copy of the app alone. */
  try {
    const errs = [];
    W.addEventListener('error', (e) => errs.push(String(e.message)));
    W.addEventListener('unhandledrejection', (e) => errs.push('unhandled rejection: ' + e.reason));
    const drawn = {};
    H.__plant(Object.assign(H.sampleData(), { settings: H.defaultSettings() }));
    const doc = W.document;
    for (const tab of H.TABS) {
      const btn = doc.getElementById('tab-' + tab);
      if (!btn) { errs.push('no tab button for ' + tab); continue; }
      btn.click();
      const panel = doc.getElementById(btn.getAttribute('aria-controls'));
      /* A panel that drew nothing is the failure this is really looking for: a
         render that threw half way leaves an element that is present and
         empty, which no "did it throw" check on its own would notice. */
      drawn['tab:' + tab] = panel ? panel.textContent.trim().length : 0;
    }
    doc.getElementById('tab-' + H.TABS[0]).click();
    const dialogs = [...doc.querySelectorAll('dialog')].filter((d) => d.id);
    for (const d of dialogs) {
      try { d.showModal(); drawn['dialog:' + d.id] = d.textContent.trim().length; d.close(); }
      catch (e) { errs.push('dialog ' + d.id + ': ' + e.message); }
    }
    asyncResults.smoke = { errs: errs, drawn: drawn, dialogs: dialogs.length };
  } catch (e) { asyncResults.smoke = { errs: ['the walk itself threw: ' + e.message], drawn: {}, dialogs: 0 }; }
  /* PUT THE FIXTURE BACK. define() plants it and switches to Entries at
     definition time, which is BEFORE this runs, and every DOM test below reads
     the app in that state — so a walk that left the sample data in place would
     hand them seven rows where they expect three. Outside the try/catch on
     purpose: if the walk fell over, the tests after it still need their fixture
     rather than whatever the walk was holding when it stopped. */
  try { H.__plant(FIXTURE); W.setTab('cellar'); } catch (e) { /* reported by the walk's own verdict */ }

  /* ── The header and the tab bar as single scrolling lines (2026-09-14) ─────
     Charles, family-wide: "should we just make them both always single line
     side scrollers?" Measured in three frames of their own — 360px, where the
     name leaves the row under its 15rem, so the controls go under it and still
     cannot fit; 500px, where they stay BESIDE the name and scroll there
     (705px until the subtitle left the name on 2026-10-24: the name alone left the
     controls room to fit there, so the frame moved in to where they overflow again)
     (Charles, the same evening: "keep buttons beside the name"); and 1600px,
     where nothing may have changed. The sample data is planted in memory first,
     since a fresh profile boots into the welcome card, which hides the tab row
     and would leave nothing to measure. Recorded here and asserted below: the
     runner awaits a test body now, but three frames measured once and read by
     several tests is cheaper than three frames per test. */
  try {
    const rowFrame = (w) => new Promise((resolve, reject) => {
      const f = document.createElement('iframe');
      f.setAttribute('data-wine-tests', '');
      f.setAttribute('aria-hidden', 'true');
      f.style.cssText = 'position:absolute;left:-9999px;top:0;border:0;width:' + w + 'px;height:800px';
      const timer = setTimeout(() => { f.remove(); reject(new Error('the ' + w + 'px frame never loaded')); }, 15000);
      f.addEventListener('load', () => { clearTimeout(timer); resolve(f); }, { once: true });
      f.src = 'index.html?rows=' + w + '-' + Date.now();
      document.body.appendChild(f);
    });
    /* Two frames and a beat: the ResizeObserver behind the arrows reports after
       layout, not during it. */
    const settle = (FW) => new Promise((r) =>
      FW.requestAnimationFrame(() => FW.requestAnimationFrame(() => setTimeout(r, 30))));
    const measure = async (w) => {
      const f = await rowFrame(w);
      try {
        const FW = f.contentWindow, D = FW.document, FH = FW.__wineTestHooks;
        FH.__plant(Object.assign(FH.sampleData(), { settings: FH.defaultSettings() }));
        await settle(FW);
        const vis = (el) => el.getClientRects().length > 0 && !el.classList.contains('sr-only')
          && FW.getComputedStyle(el).display !== 'none';
        const lines = (el) => new Set([...el.children].filter(vis)
          .map((c) => Math.round(c.getBoundingClientRect().top))).size;
        const ctl = D.querySelector('.headctl'), tabs = D.querySelector('.tabs');
        const headNav = D.querySelector('.headrow > .rownav'), tabNav = D.querySelector('.tabrow > .rownav');
        const [prev, next] = headNav.querySelectorAll('button');
        const m = {
          welcome: D.documentElement.hasAttribute('data-welcome'),
          ctlLines: lines(ctl), tabLines: lines(tabs),
          ctlRoom: ctl.scrollWidth - ctl.clientWidth, tabRoom: tabs.scrollWidth - tabs.clientWidth,
          headNavShown: !headNav.hidden, tabNavShown: !tabNav.hidden,
          prevOffAtStart: prev.disabled, nextOnAtStart: !next.disabled,
          besideName: Math.abs(ctl.getBoundingClientRect().top
            - D.querySelector('.brand').getBoundingClientRect().top) < 16,
          pageRoom: D.documentElement.scrollWidth - FW.innerWidth,
          /* The phone cards (2026-10-23): how the Cellar list lays out here. */
          listRoom: (() => { const lw = D.getElementById('listWrap'); return lw.scrollWidth - lw.clientWidth; })(),
          rowDisplay: FW.getComputedStyle(D.querySelector('#cellarTable tbody tr')).display,
          /* Each field's distinct left edges and row offsets across the cards —
             one each when every card puts the field in the same place. */
          drift: ['Region', 'Grape', 'Bottles', 'Value', 'Window', 'Where'].filter((l) => {
            const cells = [...D.querySelectorAll('#cellarTable tbody td[data-label="' + l + '"]')]
              .filter((c) => c.getBoundingClientRect().width);
            return new Set(cells.map((c) => Math.round(c.getBoundingClientRect().left))).size > 1;
          }),
          cardview: D.getElementById('cellarTable').classList.contains('cardview'),
          sortShown: FW.getComputedStyle(D.querySelector('#cellarTable thead')).display !== 'none',
        };
        /* The keyboard reveal, in the 500px frame, where the controls overflow
           BESIDE the name. A control half past a row's edge, focused, must be
           scrolled WHOLE into the row with its ring's room — the browser only
           brings in a focus target that is entirely hidden. The straddle is
           MADE rather than hoped for: at rest a 12px gap can land exactly on
           the edge, and then nothing is half past it. The tab bar is narrowed
           by hand to get a second row to try it on, since this app's two tabs
           never overflow on their own. */
        if (w === 500) {
          const reveal = (row, items) => {
            row.scrollLeft = 0;
            let box = row.getBoundingClientRect();
            const half = items.find((el) => el.getBoundingClientRect().right > box.right - 1);
            if (!half) return { found: false };
            const r0 = half.getBoundingClientRect();
            row.scrollLeft += Math.max(0, r0.left + r0.width / 2 - box.right);
            box = row.getBoundingClientRect();
            const r1 = half.getBoundingClientRect();
            const straddles = r1.left < box.right && r1.right > box.right;
            half.focus();
            const r = half.getBoundingClientRect(), b2 = row.getBoundingClientRect();
            const res = { found: true, id: half.id, straddles: straddles, focused: D.activeElement === half,
              visible: half.matches(':focus-visible'),
              leftRoom: +(r.left - b2.left).toFixed(1), rightRoom: +(b2.right - r.right).toFixed(1) };
            half.blur();
            row.scrollLeft = 0;
            return res;
          };
          m.revealHead = reveal(ctl, [...ctl.children].filter(vis));
          /* Sized from the tabs themselves: room for the first tab whole and a
             sliver of the second, so the second is the one past the edge — and
             the row is still wide enough to hold it whole, or no scroll could. */
          const tabEls = [...tabs.querySelectorAll('[role="tab"]')].filter(vis);
          const first = tabEls[0].getBoundingClientRect().width;
          tabs.style.flex = 'none';
          tabs.style.width = Math.ceil(first + 12 + 8 + 30) + 'px';
          await settle(FW);
          m.revealTabs = reveal(tabs, tabEls);
          m.revealTabs.fits = tabEls.every((el) => el.getBoundingClientRect().width <= tabs.clientWidth - 8);
          tabs.style.flex = ''; tabs.style.width = '';
          await settle(FW);
          /* The browser's OWN scroll to a focus, under the pinned header
             (2026-09-14). A control is put in the two places that scroll lets
             it stay behind the bar — half above the window's top edge (where
             Shift+Tab back up the page leaves one), and wholly inside the band
             the bar covers (which counts as visible, so is not scrolled at
             all) — then focused with no preventScroll. A spacer gives the page
             the scroll room to do it however short the sample leaves it. */
          const head = D.querySelector('header');
          const spacer = D.createElement('div');
          spacer.style.height = '3000px';
          D.body.appendChild(spacer);
          await settle(FW);
          const hb = head.getBoundingClientRect().height;
          const target = [...D.querySelectorAll('button, a[href]')].find((el) => {
            if (!vis(el) || head.contains(el) || el.matches('.skip') || el.closest('dialog')) return false;
            const r = el.getBoundingClientRect();
            return r.left >= 0 && r.width > 0 && r.height > 0 && r.height < hb - 6;
          });
          const land = (want) => {
            FW.scrollBy(0, target.getBoundingClientRect().top - want);
            const placed = Math.abs(target.getBoundingClientRect().top - want) < 2;
            const stuck = head.getBoundingClientRect().top <= 1;
            target.focus();
            const res = { placed: placed, stuck: stuck, focused: D.activeElement === target,
              top: +target.getBoundingClientRect().top.toFixed(1), headBottom: +head.getBoundingClientRect().bottom.toFixed(1) };
            target.blur();
            return res;
          };
          if (target) {
            const h = target.getBoundingClientRect().height;
            m.focusUnder = { found: true, id: target.id, straddle: land(-Math.round(h / 2)), under: land(Math.round(hb - h - 3)) };
          } else m.focusUnder = { found: false };
          spacer.remove();
          FW.scrollTo(0, 0);
          await settle(FW);
        }
        if (m.headNavShown) {
          next.click();
          m.scrolledTo = ctl.scrollLeft;
          await settle(FW);
          m.prevOnAfter = !prev.disabled;
        }
        return m;
      } finally { f.remove(); }
    };
    asyncResults.rows = { narrow: await measure(360), mid: await measure(500), wide: await measure(1600) };
  } catch (e) { asyncResults.rows = { error: e.message }; }

  try {
    const payload = H.buildSharePayload(H.normalizeState({
      wines: [{ id: 'a1', vintage: 2019, name: 'Round trip Rosé', qty: 3, valueLow: 12.5,
                drinkFrom: 2020, drinkTo: 2140 }],
      settings: { soonYears: 2 },
    }), { keep: 'all' });
    const token = await H.encodeShare(payload);
    const back = await H.decodeShare(token);
    asyncResults.roundTrip = { token: token, back: back };
  } catch (e) { asyncResults.roundTrip = { error: e.message }; }

  try {
    await H.decodeShare('9.AAAA');
    asyncResults.badMarker = 'no error';
  } catch (e) { asyncResults.badMarker = e.message; }

  try {
    const future = await H.encodeShare({ v: H.SHARE_PAYLOAD_V + 1, wines: [] });
    await H.decodeShare(future);
    asyncResults.newer = { thrown: false };
  } catch (e) { asyncResults.newer = { thrown: true, flagged: !!e.newerVersion }; }

  /* ── Where the keyboard is after a Find hit in a SHARED view ───────────────
     The one path through goToSearchHit() that opens no editor: a shared
     snapshot has no editor to open. Driven in a second frame booted at a real
     '#share=' link, with Find opened the way ⌘K opens it — findBtn.click(),
     not a press on the button — so nothing visible holds the focus first. That
     is the case the fix is for; the "already visible, leave it alone" cases are
     tested in the main frame, synchronously, below. */
  try {
    const S = await bootShared(await H.encodeShare(H.buildSharePayload(H.normalizeState({
      wines: [{ id: 'sh-1', vintage: 2020, name: 'Shared Syrah', qty: 2, drinkFrom: 2000, drinkTo: 2150 }],
      settings: H.defaultSettings(),
    }), { keep: 'all' })));
    const SD = S.document;
    /* No History in a snapshot: the log never travels in a link, so its tab
       could only say "nothing yet" (Charles, 2026-10-25). */
    const proto = S.Storage.prototype, realSet = proto.setItem, wrote = [];
    proto.setItem = function (k) { wrote.push(k); };
    try { S.setTab('history'); } finally { proto.setItem = realSet; }
    const landed = SD.documentElement.getAttribute('data-tab');
    S.setTab('opened');
    SD.getElementById('tab-opened').dispatchEvent(new S.KeyboardEvent('keydown', { key: 'End', bubbles: true }));
    asyncResults.sharedTabs = {
      historyHidden: SD.getElementById('tab-history').hidden,
      pairingsHidden: SD.getElementById('tab-pairings').hidden,
      historyDrawn: !!SD.getElementById('tab-history').getClientRects().length,
      othersShown: !SD.getElementById('tab-cellar').hidden && !SD.getElementById('tab-opened').hidden,
      landed: landed, wrote: wrote.slice(),
      endGoesTo: SD.documentElement.getAttribute('data-tab'),
    };
    SD.getElementById('tab-opened').click();         /* start on the OTHER tab */
    if (SD.activeElement && SD.activeElement.blur) SD.activeElement.blur();
    SD.getElementById('findBtn').click();
    const box = SD.getElementById('searchBox');
    box.value = 'Shared';
    box.dispatchEvent(new S.Event('input', { bubbles: true }));
    const hits = SD.querySelectorAll('#searchResults .hit').length;
    if (SD.activeElement && SD.activeElement.blur) SD.activeElement.blur();
    const before = SD.activeElement ? (SD.activeElement.id || SD.activeElement.tagName) : 'null';
    SD.querySelector('#searchResults .hit').click();
    const a = SD.activeElement;
    asyncResults.sharedFind = {
      hits: hits, before: before,
      findOpen: SD.getElementById('searchDialog').open,
      editorOpen: SD.getElementById('wineDialog').open,
      tab: S.document.documentElement.getAttribute('data-tab'),
      where: a ? (a.id || a.tagName) : 'null',
      isTab: !!(a && a.classList && a.classList.contains('tab')),
      selected: a ? a.getAttribute('aria-selected') : null,
      forTab: a && a.dataset ? a.dataset.tab : null,
      visible: !!(a && a.getClientRects && a.getClientRects().length),
    };
    /* And the other half of the rule, in the only frame that can show it: a
       REAL press on the Find button leaves the focus on the button, the
       window's close hands it back, and that is somewhere the reader can see —
       so it is left exactly where it is. */
    const fb = SD.getElementById('findBtn');
    fb.focus();
    fb.click();
    box.value = 'Shared';
    box.dispatchEvent(new S.Event('input', { bubbles: true }));
    SD.querySelector('#searchResults .hit').click();
    asyncResults.sharedFind.afterRealPress =
      SD.activeElement ? (SD.activeElement.id || SD.activeElement.tagName) : 'null';
  } catch (e) { asyncResults.sharedFind = { error: e.message }; }

  /* ── Where a press leaves the page ────────────────────────────────────────
     The family's rule, given by Charles on 2026-09-05 and carried into all five
     tabbed apps: CHANGING WHAT YOU ARE LOOKING AT GOES TO THE TOP, CHANGING
     WHICH RECORD YOU ARE LOOKING AT HOLDS STILL. A tab press is the first; a
     Find hit that opens a record is the second, because the editor is over the
     row that was searched for and moving the page would strand the reader at
     the top of a long table the moment they closed it.

     DRIVEN HERE, in the 1000x800 frame this suite boots, because a test body in
     this runner must be synchronous — and because a frame with no size cannot
     scroll at all, which would make every line of this pass over an app doing
     nothing. `down` is recorded first and asserted on for exactly that reason.
     The sample data is what makes the page taller than the frame; the fixture
     goes back afterwards, the way the smoke walk puts it back. */
  try {
    const D = W.document;
    const pause = (ms) => new Promise((r) => setTimeout(r, ms));
    const settle = async (y) => { W.scrollTo(0, y); await pause(80); return W.scrollY; };
    const press = async (t) => { D.getElementById('tab-' + t).click(); await pause(120); };
    H.__plant(Object.assign(H.sampleData(), { settings: H.defaultSettings() }));
    await pause(150);

    await press('cellar');
    const down = await settle(400);
    await press('opened');
    const afterOtherTab = W.scrollY;

    await press('cellar');
    const held = await settle(400);
    await press('cellar');
    const afterSameTab = W.scrollY;
    asyncResults.landing = { down: down, afterOtherTab: afterOtherTab,
                             held: held, afterSameTab: afterSameTab };
  } catch (e) { asyncResults.landing = { error: e.message }; }
  try { H.__plant(FIXTURE); W.setTab('cellar'); } catch (e) { /* reported by the verdict above */ }
}

    ok(/grid-template-rows:\s*subgrid/.test(APP_SRC),
       'subgrid is what lines the labels up when one of them wraps');
    ok(!/\.stat:nth-child\(\d\)/.test(APP_SRC),
       'and no rule counts a tile by position any more — that is what assumed five of them');
    /* Walks the container queries in the order the cascade does, keeping each
       tile count's state as it goes, and checks the promise at every width:
       the columns fit at the tile floor, no row holds a single tile, and a
       short last row is STRETCHED to finish the line rather than leaving a
       hole. The floor and the gap are read back out of the app, so raising
       either fails here instead of quietly making a row too tight. */
    {
      const CSS = (stripComments(APP_SRC).match(/<style>([\s\S]*?)<\/style>/) || [])[1] || '';
      const fl = CSS.match(/\.stats \{[^}]*minmax\((\d+)px/);
      ok(fl, 'the auto-fit fallback still states a smallest tile');
      const MIN = fl ? +fl[1] : 0;
      /* The gap is a pack token, so only the browser knows what it is. */
      const GAP = parseFloat(W.getComputedStyle(el).columnGap);
      ok(GAP > 0, 'and the gap resolves to a real number — ' + GAP + 'px');
      const blocks = [...CSS.matchAll(/@container tiles \(min-width: (\d+)px\) \{([\s\S]*?)\n  \}/g)];
      ok(blocks.length >= 5, 'the container queries are there — ' + blocks.length + ' of them');
      const st = {};
      let checked = 0;
      for (const [, atStr, body] of blocks) {
        const at = +atStr;
        for (const chunk of body.split('}')) {
          if (chunk.indexOf('grid-') < 0) continue;
          const targets = [...chunk.matchAll(/:nth-child\((\d+)\):last-child\)(\s*>\s*(?:\*|:nth-child\(n\+(\d+)\)))?/g)];
          ok(targets.length > 0, 'every rule says which tile counts it answers');
          const tracksM = chunk.match(/grid-template-columns: (?:repeat\((\d+),|minmax)/);
          const colM = chunk.match(/grid-column: (?:span (\d+)|(auto))/);
          for (const t of targets) {
            const n = +t[1], k = t[3] ? +t[3] : null;
            const s = st[n] || (st[n] = { tracks: 1, full: 1, last: null, first: null });
            if (tracksM) s.tracks = tracksM[1] ? +tracksM[1] : 1;
            else if (colM && k) { s.last = colM[2] ? null : +colM[1]; s.first = colM[2] ? null : k; }
            else if (colM && t[2]) s.full = colM[2] ? 1 : +colM[1];
          }
        }
        for (const key of Object.keys(st)) {
          const n = +key, s = st[n], c = s.tracks / s.full;
          ok(Number.isInteger(c) && c >= 1,
             n + ' tiles: ' + s.tracks + ' tracks do not divide by a span of ' + s.full);
          ok(c * MIN + (c - 1) * GAP <= at,
             c + ' columns need ' + (c * MIN + (c - 1) * GAP) + 'px of tiles and gaps, and the '
             + 'query lets them in at ' + at + 'px');
          ok(n >= c, n + ' tiles can never fill ' + c + ' columns');
          ok(c === 1 || n % c !== 1,
             n + ' tiles across ' + c + ' columns leaves one tile alone on the last row');
          const rows = Math.ceil(n / c), lastRow = n - c * (rows - 1);
          if (lastRow === c) {
            ok(!s.last, n + ' tiles fill every row at ' + c + ' across, so nothing may be stretched');
          } else {
            ok(s.last && lastRow * s.last === s.tracks,
               n + ' tiles at ' + c + ' across leave ' + lastRow + ' on the last row, which must be '
               + 'stretched to finish the line rather than leaving a hole');
            ok(s.first === c * (rows - 1) + 1,
               'and the stretch starts at the first tile of that row');
          }
          checked++;
        }
      }
      ok(Object.keys(st).length >= 7, 'every tile count from two to eight is answered');
      ok(checked >= 40, 'and each one is checked at every width above the one it changes at');
      ok(/:has\(> \.stats\) \{ container: tiles \/ inline-size; \}/.test(CSS),
         "the row's own parent is the named container — without it every query above "
         + 'matches nothing and the counts silently stop applying');
    }
  });

   appeared for an instant at the TOP of the page, under the header, then
   vanished as the app appeared. Every panel inside <main> is built by render(). The browser paints the parsed body
   before the main script executes, so that is what it painted. A sweep of all
   eight pages found five of them doing it; this was one.

   `data-booting` goes on the root in the HEAD script — before first paint, the

  t('the gate goes on before first paint and off with the first render', () => {
  ok(APP_SRC, 'index.html was not read — the fetch test above must run first');
  const src = stripComments(APP_SRC);
  ok(/document\.documentElement\.dataset\.booting = 'on';/.test(src), 'the head script sets it');
  /* BEFORE the theme read. That read touches localStorage, which a private-mode
     browser throws on — and that is the browser most likely to be slow enough to
     show the flash in the first place. */
  const setAt = src.indexOf("dataset.booting = 'on'");
  const themeAt = src.indexOf("localStorage.getItem('wine-theme')");
  ok(setAt > -1 && themeAt > -1 && setAt < themeAt,
     'and sets it before the theme read, which can throw', setAt + ' vs ' + themeAt);
  ok(/DOMContentLoaded', function \(\) \{\s*document\.documentElement\.removeAttribute\('data-booting'\);/
       .test(src),
     'with a DOMContentLoaded backstop, so a script that dies on the way to the '
       + 'release can never leave the page blank');
  ok(/render\(\);\s*document\.documentElement\.removeAttribute\('data-booting'\);/.test(src)
     || /\}\s*document\.documentElement\.removeAttribute\('data-booting'\);/.test(src),
     'and the release sits with the first render, in the SAME task — a frame later '
       + 'and the reveal is itself the flash');
  });

    /* EVERY dialog closes on a click off it, and this tests the BEHAVIOUR rather
       than the registration list. A source scan only ever proves an id is on a
       list; it cannot see a dialog wired through a variable, and a hand-written
       list checked by a hand-written test agrees with itself forever. Both of
       those bit on 2026-08-23 — the lottery portfolio's help window had no
       handler at all and Money Map's compare window was simply left off the list.
       Far outside rather than a few pixels: (-1000,-1000) is outside ANY
       dialog's box whatever size the 1000x800 frame gives it, so the point is
       unambiguous. The padding case — a click just INSIDE a dialog's own edge
       must NOT close it — is still verified by hand in a browser. */
    const EXEMPT = ['syncChoiceDialog'];
    const dialogs = [...W.document.querySelectorAll('dialog')];
    ok(dialogs.length >= 2, 'the dialogs were found — ' + dialogs.length);
    const stuck = [], leaky = [];
    for (const d of dialogs) {
      if (d.open) d.close();
      d.showModal();
      for (const type of ['pointerdown', 'mousedown', 'click']) {
        const E = type === 'pointerdown' ? W.PointerEvent : W.MouseEvent;

          bubbles: true, cancelable: true }));

      const closed = !d.open;
      d.close();
      if (EXEMPT.includes(d.id)) { if (closed) leaky.push(d.id); }
      else if (!closed) stuck.push(d.id);
    }
    eq(stuck.join(', '), '', 'a dialog you cannot dismiss by clicking off it');
    /* THE ONE DOCUMENTED EXCEPTION, family-wide: "which copy of your data?" has
       no safe default, so it must be answered rather than dismissed. */
    eq(leaky.join(', '), '', 'and the exception must still refuse to be dismissed');
  });

       That last one is a SHARE and deliberately not "one bold per paragraph" —
       a note that defines a list bolds one term per item and is right to.
       Money Map ran 28 notes of 200 to 1,400 characters as single paragraphs
       until 2026-08-23, which is what this exists to stop happening again. */
    const src = stripComments(APP_SRC);
    const at = src.indexOf('const HELP = {');
    const table = src.slice(at, src.indexOf('\n};', at));
    const entries = table.split(/\n  (?=\w+: \[)/).slice(1);
    ok(entries.length >= 1, 'the table was found — ' + entries.length + ' entries');
    for (const e of entries) {
      const key = e.split(':')[0].trim();
      const paras = (e.match(/<p>/g) || []).length;
      const bolds = (e.match(/<strong>/g) || []).length;
      const text = visibleText(e).replace(/\s+/g, ' ').length;
      ok(paras >= 2 || text <= 380, key + ' is over 380 characters in one paragraph');

      const boldText = visibleText((e.match(/<strong>([\s\S]*?)<\/strong>/g) || [])
        .join('')).replace(/\s+/g, ' ').length;
      ok(boldText / text < 0.4, key + ' — bold must be a minority of the note');
    }
  });

/* ── EVERY TEST IS AWAITED (2026-09-14) ─────────────────────────────────────
   This loop used to call `item.fn()` and move on. A plain test either throws or
   doesn't, so that was fine for them — but an `async` test returns a promise
   the moment it reaches its first `await`, the loop saw no throw and wrote ✓,
   and the assertions after the `await` ran later against a row already marked
   green. Their failures went nowhere at all: a rejected promise nobody holds.
   The gate test "a loaded page never holds the gate…" was written that way and
   could never fail. Now the loop awaits whatever a test returns — `await` on a
   plain function's `undefined` costs nothing — so an async test is as honest as
   a plain one and can be written in the ordinary way.
   Raced against a timeout, because an awaited test that never settles (a frame
   whose `load` never comes) would otherwise leave the page on "Loading…" for
   ever, which CI reads as a hang rather than a named failure. */
const TEST_TIMEOUT_MS = 20000;
async function run() {
  const out = document.getElementById('out');
  let pass = 0, fail = 0;
  for (const item of TESTS) {
    if (item.group) {
      const tr = document.createElement('tr');
      tr.className = 'group';
      const td = document.createElement('td');
      td.colSpan = 3; td.textContent = item.group;
      tr.appendChild(td); out.appendChild(tr);
      continue;
    }
    let err = null, timer = null;
    try {
      await Promise.race([
        Promise.resolve().then(() => item.fn()),
        new Promise((resolve, reject) => {
          timer = setTimeout(() => reject(new Error('the test never finished — gave up after '
            + TEST_TIMEOUT_MS / 1000 + 's')), TEST_TIMEOUT_MS);
        }),
      ]);
    } catch (e) { err = e; } finally { clearTimeout(timer); }
    const tr = document.createElement('tr');
    tr.className = err ? 'fail' : 'pass';
    const st = document.createElement('td');
    st.className = 'st'; st.textContent = err ? '✕' : '✓';
    const name = document.createElement('td'); name.textContent = item.name;
    const msg = document.createElement('td');
    msg.className = 'msg'; msg.textContent = err ? err.message : '';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    if (err) fail++; else pass++;
  }
  /* The floor — see EXPECTED at the top. Written as a row of its own so it reads
     like any other failure, and counted into `fail` so CI's "All N tests pass"
     check cannot match. */
  if (pass + fail < EXPECTED) {
    const tr = document.createElement('tr');
    tr.className = 'fail';
    const st = document.createElement('td'); st.className = 'st'; st.textContent = '✕';
    const name = document.createElement('td');
    name.textContent = 'the suite ran only ' + (pass + fail) + ' of at least ' + EXPECTED + ' tests';
    const msg = document.createElement('td'); msg.className = 'msg';
    msg.textContent = 'tests have gone missing rather than failed, so a green result here would '
      + 'cover a fraction of the suite. If they were retired on purpose, lower EXPECTED to match.';
    tr.appendChild(st); tr.appendChild(name); tr.appendChild(msg);
    out.appendChild(tr);
    fail++;
  }
  const s = document.getElementById('summary');
  s.textContent = fail === 0 ? 'All ' + pass + ' tests pass' : fail + ' of ' + (pass + fail) + ' tests FAILED';
  s.className = fail === 0 ? 'ok' : 'bad';
  document.title = (fail === 0 ? '✓ ' : '✕ ') + document.title;
}

main().catch((e) => {
  const s = document.getElementById('summary');
  s.className = 'bad';
  s.textContent = 'The suite could not start: ' + e.message;
});
</script>
</body>
</html>
